project:
  type: website
  output-dir: docs
  resources:
    - files/slides/**
    - files/networks/**
    - network-background.js
  render:
    - index.qmd
    - news.qmd
    - projects.qmd
    - publications.qmd
    - conferences.qmd
    - teaching.qmd
    - contact.qmd
    - 404.qmd

description-meta: "Matías Montero - DPhil researcher in education at the University of Oxford, studying inequality, social networks, and educational trajectories."
author-meta: "Matías Montero"

website:
  title: "Matías Montero"
  image: "/files/images/matias-montero-profile.jpg"
  description: "Sociology of education, social network analysis, and educational inequalities"
  favicon: files/images/matias-montero-profile.jpg
  navbar:
    background: light
    pinned: true
    left:
      - text: Research
        href: projects.qmd
      - text: News
        href: news.qmd
      - text: Publications
        href: publications.qmd
      - text: Talks
        href: conferences.qmd
      - text: Teaching
        href: teaching.qmd
    right:
      - text: CV
        href: files/Montero_CV.pdf
        target: _blank
      - icon: github
        href: https://github.com/monteromati
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/in/matiasmonteros/
        target: _blank

  page-navigation: true
  back-to-top-navigation: true
  page-footer:
    left: "© <script>document.write(new Date().getFullYear())</script> Matías Montero"
    center: "DPhil in Education · University of Oxford"
    right:
      - text: Email
        href: mailto:matias.montero@education.ox.ac.uk
      - icon: github
        href: https://github.com/monteromati
        target: _blank

  search:
    location: navbar
    type: overlay

  draft-mode: unlinked
  repo-url: https://github.com/monteromati/matiasmontero.github.io
  open-graph: true
  twitter-card: true
  site-url: "https://monteromati.github.io"

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    anchor-sections: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: true
    link-external-newwindow: true
    email-obfuscation: javascript
    include-in-header: "files/includes/_academic.qmd"
    include-after-body: "files/includes/network-background.html"
